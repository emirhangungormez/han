    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        // GSAP Animations
        gsap.registerPlugin(ScrollTrigger);
        
        // Smooth scroll animation for navigation
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });
        
        // Scroll indicator fade out on scroll
        window.addEventListener('scroll', () => {
            const scrollIndicator = document.querySelector('.scroll-indicator');
            if (window.scrollY > 100) {
                scrollIndicator.style.opacity = '0';
            } else {
                scrollIndicator.style.opacity = '0.7';
            }
        });
        
        // Parallax scroll effect for sections (excluding hero section)
        gsap.utils.toArray(".scroll-section:not(:first-child)").forEach((section, i) => {
            ScrollTrigger.create({
                trigger: section,
                start: "top top",
                pin: true,
                pinSpacing: false
            });
        });
        
        // Footer text animation
        gsap.to(".mega-text", {
            scrollTrigger: {
                trigger: "footer",
                start: "top bottom",
                end: "bottom top",
                scrub: 1
            },
            y: -100,
            opacity: 1
        });

        // Scroll GSAP + Lenis Code
        const lenis = new Lenis({
          duration: 0.7, // Scroll süresi
          easing: (t) => t * (2 - t), // Easing fonksiyonu
          smooth: true // Smooth scrolling etkinleştirme
        });

        lenis.on('scroll', (e) => {
          // console.log(e); // İsterseniz debug için açabilirsiniz
        });

        function raf(time) {
          lenis.raf(time);
          requestAnimationFrame(raf);
        }

        requestAnimationFrame(raf);
    </script>
